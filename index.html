<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker Tournament Timer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .header {
      padding: 20px;
      text-align: center;
      width: 100%;
      background: #111;
      border-bottom: 1px solid #222;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      width: 100%;
      max-width: 600px;
    }

    .level-info {
      text-align: center;
      margin-bottom: 20px;
    }

    .level-label {
      font-size: 1rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .level-number {
      font-size: 2rem;
      font-weight: 700;
      color: #4ade80;
    }

    .blinds-display {
      text-align: center;
      margin-bottom: 30px;
    }

    .blinds-label {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .blinds-value {
      font-size: 2.8rem;
      font-weight: 700;
    }

    .ante-value {
      font-size: 1.2rem;
      color: #f59e0b;
      margin-top: 4px;
    }

    .timer-display {
      font-size: 6rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      margin-bottom: 30px;
      transition: color 0.3s;
    }

    .timer-display.warning { color: #f59e0b; }
    .timer-display.danger { color: #ef4444; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .next-level {
      text-align: center;
      padding: 12px 20px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-bottom: 30px;
      border: 1px solid #333;
    }

    .next-level .label {
      font-size: 0.75rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .next-level .value {
      font-size: 1.1rem;
      color: #aaa;
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 100px;
    }

    .btn:active { transform: scale(0.95); }

    .btn-play {
      background: #4ade80;
      color: #000;
    }

    .btn-pause {
      background: #f59e0b;
      color: #000;
    }

    .btn-reset {
      background: #333;
      color: #fff;
    }

    .btn-prev, .btn-next {
      background: #222;
      color: #fff;
      border: 1px solid #444;
    }

    .btn:hover { opacity: 0.85; }

    /* Setup Screen */
    .setup {
      width: 100%;
      max-width: 500px;
      padding: 20px;
    }

    .setup h2 {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .preset-btn {
      padding: 16px 20px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      border-color: #4ade80;
      background: #111;
    }

    .preset-btn .name {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .preset-btn .desc {
      font-size: 0.8rem;
      color: #888;
    }

    /* Blind Structure Table */
    .structure-panel {
      position: fixed;
      top: 0;
      right: -100%;
      width: 320px;
      height: 100%;
      background: #111;
      border-left: 1px solid #333;
      overflow-y: auto;
      transition: right 0.3s;
      z-index: 100;
      padding: 20px;
    }

    .structure-panel.open { right: 0; }

    .structure-panel h3 {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .structure-panel .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .structure-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .structure-table th {
      text-align: left;
      padding: 8px 6px;
      color: #666;
      border-bottom: 1px solid #333;
      font-weight: 500;
    }

    .structure-table td {
      padding: 8px 6px;
      border-bottom: 1px solid #1a1a1a;
    }

    .structure-table tr.current td {
      color: #4ade80;
      font-weight: 600;
    }

    .structure-table tr.break-row td {
      color: #60a5fa;
      font-style: italic;
    }

    .btn-structure {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      z-index: 50;
    }

    .btn-settings {
      position: fixed;
      top: 20px;
      left: 20px;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      z-index: 50;
    }

    /* Settings Modal */
    .settings-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      z-index: 200;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
      display: none;
    }

    .settings-modal.open { display: block; }

    .settings-modal h3 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-modal .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .settings-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #333;
    }

    .settings-section:last-child { border-bottom: none; }

    .settings-section .section-title {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .time-adjust {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .time-adjust .btn {
      padding: 10px 16px;
      font-size: 0.85rem;
      min-width: 60px;
    }

    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .settings-row label {
      font-size: 0.9rem;
      color: #ccc;
    }

    .settings-row input {
      width: 80px;
      padding: 8px;
      background: #0a0a0a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      text-align: center;
    }

    .settings-row select {
      padding: 8px 12px;
      background: #0a0a0a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    .btn-save {
      background: #4ade80;
      color: #000;
      width: 100%;
      margin-top: 12px;
    }

    /* Player Count */
    .player-section {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: #1a1a1a;
      border-radius: 8px;
    }

    .player-section .label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
    }

    .player-section .count {
      font-size: 1.4rem;
      font-weight: 600;
      min-width: 30px;
      text-align: center;
    }

    .player-section .adj-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #444;
      background: #222;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 90;
      display: none;
    }

    .overlay.open { display: block; }

    /* Custom Structure Editor */
    .custom-editor {
      margin-top: 20px;
      padding: 16px;
      background: #1a1a1a;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .custom-editor h3 {
      font-size: 1rem;
      margin-bottom: 12px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .input-row label {
      font-size: 0.8rem;
      color: #888;
      min-width: 80px;
    }

    .input-row input, .input-row select {
      flex: 1;
      padding: 8px 12px;
      background: #0a0a0a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
    }

    .chip-info {
      text-align: center;
      font-size: 0.8rem;
      color: #666;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .timer-display { font-size: 4rem; }
      .blinds-value { font-size: 2rem; }
      .structure-panel { width: 100%; }
    }

    /* Landscape Mode */
    @media (orientation: landscape) and (max-height: 500px) {
      .header { padding: 8px; }
      .header h1 { font-size: 1rem; }

      #timer-screen {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        padding: 10px 20px;
        gap: 0;
      }

      #timer-screen .player-section {
        position: absolute;
        top: 50px;
        right: 20px;
        margin: 0;
        padding: 6px 12px;
        font-size: 0.8rem;
      }

      .landscape-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-width: 40%;
      }

      .landscape-right {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        min-width: 40%;
      }

      .level-info { margin-bottom: 4px; }
      .level-label { font-size: 0.75rem; margin-bottom: 2px; }
      .level-number { font-size: 1.4rem; }

      .blinds-display { margin-bottom: 8px; }
      .blinds-label { font-size: 0.7rem; margin-bottom: 2px; }
      .blinds-value { font-size: 2.2rem; }
      .ante-value { font-size: 1rem; }

      .timer-display {
        font-size: 5.5rem;
        margin-bottom: 8px;
      }

      .next-level {
        margin-bottom: 10px;
        padding: 8px 14px;
      }

      .controls { gap: 8px; }
      .btn { padding: 10px 20px; font-size: 0.9rem; min-width: 80px; }
    }

    /* Fullscreen landscape - even bigger */
    @media (orientation: landscape) and (min-width: 600px) and (max-height: 500px) {
      .timer-display { font-size: 7rem; }
      .blinds-value { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>♠ POKER TOURNAMENT TIMER ♣</h1>
  </div>

  <!-- Setup Screen -->
  <div class="main" id="setup-screen">
    <div class="setup">
      <h2>選擇錦標賽結構</h2>
      <div class="preset-list">
        <button class="preset-btn" onclick="startPreset('turbo')">
          <div class="name">⚡ Turbo（快速）</div>
          <div class="desc">5分鐘/level · 10 levels · 適合 2-4人 快打</div>
        </button>
        <button class="preset-btn" onclick="startPreset('standard')">
          <div class="name">🎯 Standard（標準）</div>
          <div class="desc">10分鐘/level · 15 levels · 適合 4-8人 Home Game</div>
        </button>
        <button class="preset-btn" onclick="startPreset('deep')">
          <div class="name">🏆 Deep Stack</div>
          <div class="desc">15分鐘/level · 20 levels · 適合正式比賽</div>
        </button>
        <button class="preset-btn" onclick="startPreset('cash')">
          <div class="name">💰 Cash Game Timer</div>
          <div class="desc">30分鐘提醒 · 無 blind 升級 · 記錄遊戲時間</div>
        </button>
      </div>

      <div class="custom-editor">
        <h3>⚙️ 自訂設定</h3>
        <div class="input-row">
          <label>起始籌碼</label>
          <select id="starting-chips">
            <option value="1000">1,000</option>
            <option value="1500">1,500</option>
            <option value="2000">2,000</option>
            <option value="3000">3,000</option>
            <option value="5000" selected>5,000</option>
            <option value="10000">10,000</option>
            <option value="20000">20,000</option>
          </select>
        </div>
        <div class="input-row">
          <label>每 Level</label>
          <select id="level-duration">
            <option value="3">3 分鐘</option>
            <option value="5">5 分鐘</option>
            <option value="8">8 分鐘</option>
            <option value="10" selected>10 分鐘</option>
            <option value="12">12 分鐘</option>
            <option value="15">15 分鐘</option>
            <option value="20">20 分鐘</option>
          </select>
        </div>
        <div class="input-row">
          <label>玩家人數</label>
          <select id="player-count">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6" selected>6</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
          </select>
        </div>
        <button class="btn btn-play" style="width:100%; margin-top: 12px;" onclick="startCustom()">
          開始自訂錦標賽
        </button>
      </div>
    </div>
  </div>

  <!-- Timer Screen -->
  <div class="main" id="timer-screen" style="display:none;">
    <div class="player-section">
      <span class="label">玩家</span>
      <button class="adj-btn" onclick="adjustPlayers(-1)">−</button>
      <span class="count" id="player-display">6</span>
      <button class="adj-btn" onclick="adjustPlayers(1)">+</button>
      <span class="chip-info" id="chip-info"></span>
    </div>

    <div class="landscape-left">
      <div class="level-info">
        <div class="level-label">Level</div>
        <div class="level-number" id="level-display">1</div>
      </div>

      <div class="blinds-display">
        <div class="blinds-label">Blinds</div>
        <div class="blinds-value" id="blinds-display">25 / 50</div>
        <div class="ante-value" id="ante-display"></div>
      </div>

      <div class="next-level">
        <div class="label">Next Level</div>
        <div class="value" id="next-level-display">50 / 100</div>
      </div>
    </div>

    <div class="landscape-right">
      <div class="timer-display" id="timer-display">10:00</div>

      <div class="controls">
        <button class="btn btn-prev" onclick="prevLevel()">◀ Prev</button>
        <button class="btn btn-play" id="play-btn" onclick="toggleTimer()">▶ Start</button>
        <button class="btn btn-next" onclick="nextLevel()">Next ▶</button>
      </div>
      <div class="controls" style="margin-top: 10px;">
        <button class="btn btn-reset" onclick="resetTournament()">↺ Reset</button>
      </div>
    </div>
  </div>

  <!-- Structure Panel -->
  <div class="overlay" id="overlay" onclick="closeStructure(); closeSettings();"></div>
  <div class="structure-panel" id="structure-panel">
    <button class="close-btn" onclick="closeStructure()">✕</button>
    <h3>Blind Structure</h3>
    <table class="structure-table" id="structure-table">
    </table>
  </div>
  <button class="btn-structure" id="btn-structure" style="display:none;" onclick="openStructure()">📋 Structure</button>
  <button class="btn-settings" id="btn-settings" style="display:none;" onclick="openSettings()">⚙️ Settings</button>

  <!-- Settings Modal -->
  <div class="settings-modal" id="settings-modal">
    <h3>
      ⚙️ 遊戲設定
      <button class="close-btn" onclick="closeSettings()">✕</button>
    </h3>

    <div class="settings-section">
      <div class="section-title">⏱️ 調整當前時間</div>
      <div class="time-adjust">
        <button class="btn btn-prev" onclick="adjustTime(-60)">-1分</button>
        <button class="btn btn-prev" onclick="adjustTime(-30)">-30秒</button>
        <button class="btn btn-next" onclick="adjustTime(30)">+30秒</button>
        <button class="btn btn-next" onclick="adjustTime(60)">+1分</button>
        <button class="btn btn-next" onclick="adjustTime(300)">+5分</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">📐 Level 時長</div>
      <div class="settings-row">
        <label>每個 Level</label>
        <select id="edit-duration" onchange="updateDuration()">
          <option value="3">3 分鐘</option>
          <option value="5">5 分鐘</option>
          <option value="8">8 分鐘</option>
          <option value="10">10 分鐘</option>
          <option value="12">12 分鐘</option>
          <option value="15">15 分鐘</option>
          <option value="20">20 分鐘</option>
          <option value="25">25 分鐘</option>
          <option value="30">30 分鐘</option>
        </select>
      </div>
    </div>

    <div class="settings-section">
      <div class="section-title">💰 修改當前 Blinds</div>
      <div class="settings-row">
        <label>Small Blind</label>
        <input type="number" id="edit-sb" min="1">
      </div>
      <div class="settings-row">
        <label>Big Blind</label>
        <input type="number" id="edit-bb" min="1">
      </div>
      <div class="settings-row">
        <label>Ante</label>
        <input type="number" id="edit-ante" min="0">
      </div>
      <button class="btn btn-save" onclick="saveBlinds()">✓ 儲存 Blinds</button>
    </div>

    <div class="settings-section">
      <div class="section-title">🔊 音效</div>
      <div class="settings-row">
        <label>Level 升級提示</label>
        <select id="edit-sound">
          <option value="on">開</option>
          <option value="off">關</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Audio -->
  <audio id="level-up-sound" preload="auto">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=" type="audio/wav">
  </audio>

  <script>
    // ===== BLIND STRUCTURES =====
    const STRUCTURES = {
      turbo: {
        name: 'Turbo',
        duration: 5, // minutes per level
        startingChips: 3000,
        levels: [
          { sb: 25, bb: 50 },
          { sb: 50, bb: 100 },
          { sb: 75, bb: 150 },
          { sb: 100, bb: 200 },
          { sb: 150, bb: 300 },
          { sb: 200, bb: 400, ante: 50 },
          { sb: 300, bb: 600, ante: 75 },
          { sb: 400, bb: 800, ante: 100 },
          { sb: 500, bb: 1000, ante: 150 },
          { sb: 750, bb: 1500, ante: 200 },
        ]
      },
      standard: {
        name: 'Standard',
        duration: 10,
        startingChips: 5000,
        levels: [
          { sb: 25, bb: 50 },
          { sb: 50, bb: 100 },
          { sb: 75, bb: 150 },
          { sb: 100, bb: 200 },
          { sb: 100, bb: 200, ante: 25 },
          { sb: 150, bb: 300, ante: 50 },
          { sb: 200, bb: 400, ante: 50 },
          { sb: 250, bb: 500, ante: 75 },
          { sb: 300, bb: 600, ante: 100 },
          { type: 'break', duration: 5 },
          { sb: 400, bb: 800, ante: 100 },
          { sb: 500, bb: 1000, ante: 150 },
          { sb: 600, bb: 1200, ante: 200 },
          { sb: 800, bb: 1600, ante: 200 },
          { sb: 1000, bb: 2000, ante: 300 },
        ]
      },
      deep: {
        name: 'Deep Stack',
        duration: 15,
        startingChips: 10000,
        levels: [
          { sb: 25, bb: 50 },
          { sb: 50, bb: 100 },
          { sb: 75, bb: 150 },
          { sb: 100, bb: 200 },
          { sb: 125, bb: 250 },
          { sb: 150, bb: 300 },
          { sb: 200, bb: 400 },
          { type: 'break', duration: 10 },
          { sb: 250, bb: 500, ante: 50 },
          { sb: 300, bb: 600, ante: 75 },
          { sb: 400, bb: 800, ante: 100 },
          { sb: 500, bb: 1000, ante: 125 },
          { sb: 600, bb: 1200, ante: 150 },
          { sb: 800, bb: 1600, ante: 200 },
          { type: 'break', duration: 10 },
          { sb: 1000, bb: 2000, ante: 250 },
          { sb: 1500, bb: 3000, ante: 400 },
          { sb: 2000, bb: 4000, ante: 500 },
          { sb: 2500, bb: 5000, ante: 600 },
          { sb: 3000, bb: 6000, ante: 800 },
        ]
      },
      cash: {
        name: 'Cash Game',
        duration: 30,
        startingChips: 0,
        levels: [
          { sb: 1, bb: 2, label: 'Session Timer' },
        ]
      }
    };

    // ===== STATE =====
    let state = {
      running: false,
      currentLevel: 0,
      timeLeft: 0, // seconds
      players: 6,
      structure: null,
      startingChips: 5000,
      intervalId: null,
      totalElapsed: 0,
    };

    // ===== TIMER LOGIC =====
    function startPreset(preset) {
      const s = STRUCTURES[preset];
      state.structure = s;
      state.startingChips = s.startingChips;
      state.players = parseInt(document.getElementById('player-count').value);
      startTimer();
    }

    function startCustom() {
      const duration = parseInt(document.getElementById('level-duration').value);
      const chips = parseInt(document.getElementById('starting-chips').value);
      state.players = parseInt(document.getElementById('player-count').value);
      state.startingChips = chips;

      // Generate structure based on duration and chips
      state.structure = generateStructure(duration, chips);
      startTimer();
    }

    function generateStructure(duration, chips) {
      const levels = [];
      let sb = Math.max(Math.round(chips / 200), 5);
      // Round to nice number
      sb = roundNice(sb);

      for (let i = 0; i < 20; i++) {
        const entry = { sb: sb, bb: sb * 2 };
        if (i >= 6) entry.ante = Math.round(sb * 0.25);
        levels.push(entry);

        // Add break every 6 levels
        if ((i + 1) % 6 === 0 && i < 18) {
          levels.push({ type: 'break', duration: Math.min(duration, 10) });
        }

        // Escalate
        if (sb < 100) sb = roundNice(sb * 1.5);
        else if (sb < 1000) sb = roundNice(sb * 1.4);
        else sb = roundNice(sb * 1.3);
      }

      return { name: 'Custom', duration, startingChips: chips, levels };
    }

    function roundNice(n) {
      if (n <= 25) return Math.round(n / 5) * 5;
      if (n <= 100) return Math.round(n / 25) * 25;
      if (n <= 500) return Math.round(n / 50) * 50;
      if (n <= 2000) return Math.round(n / 100) * 100;
      return Math.round(n / 500) * 500;
    }

    function startTimer() {
      state.currentLevel = 0;
      state.totalElapsed = 0;
      loadLevel(0);
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('timer-screen').style.display = 'flex';
      document.getElementById('btn-structure').style.display = 'block';
      document.getElementById('btn-settings').style.display = 'block';
      document.getElementById('player-display').textContent = state.players;
      updateChipInfo();
      renderStructureTable();
    }

    function loadLevel(idx) {
      if (idx < 0 || idx >= state.structure.levels.length) return;
      state.currentLevel = idx;
      const level = state.structure.levels[idx];

      if (level.type === 'break') {
        state.timeLeft = (level.duration || 5) * 60;
        document.getElementById('level-display').textContent = '☕ BREAK';
        document.getElementById('blinds-display').textContent = '休息時間';
        document.getElementById('ante-display').textContent = '';
      } else {
        state.timeLeft = state.structure.duration * 60;
        const displayIdx = getDisplayLevelNumber(idx);
        document.getElementById('level-display').textContent = displayIdx;
        document.getElementById('blinds-display').textContent = 
          `${formatNum(level.sb)} / ${formatNum(level.bb)}`;
        document.getElementById('ante-display').textContent = 
          level.ante ? `Ante: ${formatNum(level.ante)}` : '';
      }

      updateTimerDisplay();
      updateNextLevel();
      renderStructureTable();
    }

    function getDisplayLevelNumber(idx) {
      let count = 0;
      for (let i = 0; i <= idx; i++) {
        if (state.structure.levels[i].type !== 'break') count++;
      }
      return count;
    }

    function updateNextLevel() {
      const nextIdx = state.currentLevel + 1;
      const el = document.getElementById('next-level-display');
      if (nextIdx >= state.structure.levels.length) {
        el.textContent = '最後一個 Level';
        return;
      }
      const next = state.structure.levels[nextIdx];
      if (next.type === 'break') {
        el.textContent = '☕ Break';
      } else {
        el.textContent = `${formatNum(next.sb)} / ${formatNum(next.bb)}` +
          (next.ante ? ` (Ante ${formatNum(next.ante)})` : '');
      }
    }

    function toggleTimer() {
      if (state.running) {
        pauseTimer();
      } else {
        resumeTimer();
      }
    }

    function resumeTimer() {
      state.running = true;
      const btn = document.getElementById('play-btn');
      btn.textContent = '⏸ Pause';
      btn.className = 'btn btn-pause';

      state.intervalId = setInterval(() => {
        state.timeLeft--;
        state.totalElapsed++;
        updateTimerDisplay();

        if (state.timeLeft <= 0) {
          levelUp();
        }
      }, 1000);
    }

    function pauseTimer() {
      state.running = false;
      clearInterval(state.intervalId);
      const btn = document.getElementById('play-btn');
      btn.textContent = '▶ Start';
      btn.className = 'btn btn-play';
    }

    function levelUp() {
      // Play sound
      playAlert();

      if (state.currentLevel + 1 >= state.structure.levels.length) {
        pauseTimer();
        document.getElementById('timer-display').textContent = 'FINAL';
        return;
      }

      loadLevel(state.currentLevel + 1);
    }

    function nextLevel() {
      const wasRunning = state.running;
      if (wasRunning) pauseTimer();
      if (state.currentLevel + 1 < state.structure.levels.length) {
        loadLevel(state.currentLevel + 1);
      }
      if (wasRunning) resumeTimer();
    }

    function prevLevel() {
      const wasRunning = state.running;
      if (wasRunning) pauseTimer();
      if (state.currentLevel > 0) {
        loadLevel(state.currentLevel - 1);
      }
      if (wasRunning) resumeTimer();
    }

    function resetTournament() {
      pauseTimer();
      document.getElementById('setup-screen').style.display = 'flex';
      document.getElementById('timer-screen').style.display = 'none';
      document.getElementById('btn-structure').style.display = 'none';
      state.structure = null;
      state.currentLevel = 0;
    }

    function updateTimerDisplay() {
      const mins = Math.floor(state.timeLeft / 60);
      const secs = state.timeLeft % 60;
      const display = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      const el = document.getElementById('timer-display');
      el.textContent = display;

      // Warning states
      el.classList.remove('warning', 'danger');
      if (state.timeLeft <= 30) el.classList.add('danger');
      else if (state.timeLeft <= 60) el.classList.add('warning');
    }

    function adjustPlayers(delta) {
      state.players = Math.max(2, Math.min(20, state.players + delta));
      document.getElementById('player-display').textContent = state.players;
      updateChipInfo();
    }

    function updateChipInfo() {
      if (state.startingChips > 0) {
        const total = state.startingChips * state.players;
        document.getElementById('chip-info').textContent = 
          `Total: ${formatNum(total)} chips`;
      }
    }

    function formatNum(n) {
      return n.toLocaleString();
    }

    // ===== STRUCTURE PANEL =====
    function openStructure() {
      document.getElementById('structure-panel').classList.add('open');
      document.getElementById('overlay').classList.add('open');
    }

    function closeStructure() {
      document.getElementById('structure-panel').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    function renderStructureTable() {
      if (!state.structure) return;
      const table = document.getElementById('structure-table');
      let html = `<thead><tr><th>#</th><th>SB</th><th>BB</th><th>Ante</th><th>Time</th></tr></thead><tbody>`;
      
      let levelNum = 0;
      state.structure.levels.forEach((level, idx) => {
        const isCurrent = idx === state.currentLevel;
        if (level.type === 'break') {
          html += `<tr class="break-row ${isCurrent ? 'current' : ''}">
            <td colspan="4">☕ Break</td>
            <td>${level.duration || 5}m</td>
          </tr>`;
        } else {
          levelNum++;
          html += `<tr class="${isCurrent ? 'current' : ''}">
            <td>${levelNum}</td>
            <td>${formatNum(level.sb)}</td>
            <td>${formatNum(level.bb)}</td>
            <td>${level.ante ? formatNum(level.ante) : '—'}</td>
            <td>${state.structure.duration}m</td>
          </tr>`;
        }
      });

      html += '</tbody>';
      table.innerHTML = html;
    }

    // ===== AUDIO =====
    function playAlert() {
      if (!soundEnabled) return;
      // Web Audio API beep
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        osc.type = 'sine';
        gain.gain.value = 0.3;
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.stop(ctx.currentTime + 0.5);

        // Second beep
        setTimeout(() => {
          const osc2 = ctx.createOscillator();
          const gain2 = ctx.createGain();
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.frequency.value = 1100;
          osc2.type = 'sine';
          gain2.gain.value = 0.3;
          osc2.start();
          gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc2.stop(ctx.currentTime + 0.5);
        }, 300);
      } catch(e) {}
    }

    // ===== KEYBOARD SHORTCUTS =====
    document.addEventListener('keydown', (e) => {
      if (document.getElementById('timer-screen').style.display === 'none') return;
      
      switch(e.code) {
        case 'Space':
          e.preventDefault();
          toggleTimer();
          break;
        case 'ArrowRight':
          nextLevel();
          break;
        case 'ArrowLeft':
          prevLevel();
          break;
        case 'Escape':
          closeSettings();
          closeStructure();
          break;
      }
    });

    // ===== SETTINGS =====
    let soundEnabled = true;

    function openSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('open');
      document.getElementById('overlay').classList.add('open');

      // Populate current values
      document.getElementById('edit-duration').value = state.structure.duration;
      
      const level = state.structure.levels[state.currentLevel];
      if (level && level.type !== 'break') {
        document.getElementById('edit-sb').value = level.sb;
        document.getElementById('edit-bb').value = level.bb;
        document.getElementById('edit-ante').value = level.ante || 0;
      }
      
      document.getElementById('edit-sound').value = soundEnabled ? 'on' : 'off';
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
    }

    function adjustTime(seconds) {
      state.timeLeft = Math.max(0, state.timeLeft + seconds);
      updateTimerDisplay();
    }

    function updateDuration() {
      const newDuration = parseInt(document.getElementById('edit-duration').value);
      state.structure.duration = newDuration;
      renderStructureTable();
    }

    function saveBlinds() {
      const sb = parseInt(document.getElementById('edit-sb').value);
      const bb = parseInt(document.getElementById('edit-bb').value);
      const ante = parseInt(document.getElementById('edit-ante').value) || 0;

      if (sb > 0 && bb > 0) {
        const level = state.structure.levels[state.currentLevel];
        if (level && level.type !== 'break') {
          level.sb = sb;
          level.bb = bb;
          level.ante = ante;

          document.getElementById('blinds-display').textContent = 
            `${formatNum(sb)} / ${formatNum(bb)}`;
          document.getElementById('ante-display').textContent = 
            ante ? `Ante: ${formatNum(ante)}` : '';
          renderStructureTable();
        }
      }
      closeSettings();
    }

    // Override sound check
    document.getElementById('edit-sound').addEventListener('change', (e) => {
      soundEnabled = e.target.value === 'on';
    });

    // Prevent sleep on mobile
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch(e) {}
    }
    
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.running) {
        requestWakeLock();
      }
    });
  </script>
</body>
</html>
